<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAC TACTICAL HUB</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 共通CSSの読み込み -->
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
  
  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold text-amber-500 text-xl fa-crosshairs"></i>
        <h1 class="font-black text-sm tracking-wider text-slate-100 uppercase">CAC TACTICAL HUB</h1>
      </div>
      <!-- 参加人数がリアルタイムで表示されるように修正 -->
      <div id="total-players-count" class="text-xs bg-slate-700/80 text-slate-300 font-bold px-2.5 py-1 rounded-full border border-slate-600">
        参加者: 0名
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-5">

    <!-- Tab Navigation (3 Tabs for viewers: Ranking & Teams) -->
    <div class="grid grid-cols-2 gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs font-bold text-center">
      <button id="tab-ranking" onclick="switchTab('ranking')" class="py-2.5 rounded-md bg-amber-500 text-slate-950 shadow transition">
        <i class="fa-solid fa-trophy block text-sm mb-0.5"></i>順位
      </button>
      <button id="tab-teams" onclick="switchTab('teams')" class="py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-users block text-sm mb-0.5"></i>チーム編成
      </button>
      <button id="tab-game-rules" onclick="switchTab('game-rules')" class="py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-book block text-sm mb-0.5"></i>ルール
      </button>
    </div>

    <!-- TAB 1: RANKING -->
    <section id="sec-ranking" class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-300">個人（ユーザー）順位</h2>
      </div>

      <div id="ranking-list" class="space-y-2">
        <!-- Ranking Cards Injected Here -->
      </div>
    </section>

    <!-- TAB 2: TEAM MANAGEMENT -->
    <section id="sec-teams" class="hidden space-y-4">
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase">チーム一覧と総レベル・所属メンバー</h2>
        <div id="teams-container" class="space-y-3">
          <!-- Team Cards Injected Here -->
        </div>
      </div>
    </section>
    
    <!-- TAB 3: GAME RULES -->
    <section id="sec-game-rules" class="hidden space-y-4">
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-400 uppercase">ルール絞り込み</h2>
        </div>
        <!-- タイトル絞り込み用セレクトボックス -->
        <select id="rule-filter-select" onchange="filterGameRules()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
          <option value="all">すべてのルールを表示</option>
        </select>
      </div>

      <!-- ルール詳細表示カード一覧 -->
      <div id="viewer-game-rules-list" class="space-y-3">
      <!-- Injected via JS -->
      </div>
    </section>

    <!-- Recent Log Preview -->
    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-2">
      <h3 class="text-xs font-bold text-slate-400 uppercase">直近のポイント獲得履歴</h3>
      <div id="recent-logs" class="space-y-1.5 text-xs text-slate-300">
        <div class="text-slate-500 italic">履歴はありません</div>
      </div>
    </div>

  </main>

  <!-- 閲覧用JavaScriptファイルの読み込み -->
  <script type="module" src="index-script.js"></script>
</body>
</html>
