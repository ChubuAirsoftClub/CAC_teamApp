<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAC TACTICAL HUB | 管理者画面</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- 外部CSSの読み込み -->
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

<!-- 簡易ログインモーダル -->
  <div id="login-modal" class="fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl text-center">
      <div class="w-12 h-12 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-100">管理者ログイン</h2>
        <p class="text-xs text-slate-400 mt-1">パスワードを入力してログインしてください</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-3">
        <input type="password" id="login-password" placeholder="パスワードを入力" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white text-center tracking-widest focus:outline-none focus:border-amber-500">
        <p id="login-error" class="text-xs text-rose-400 hidden font-bold">パスワードが正しくありません</p>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
          ログイン
        </button>
      </form>
    </div>
  </div>
  
  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold text-amber-500 text-xl fa-crosshairs"></i>
        <h1 class="font-black text-sm tracking-wider text-slate-100 uppercase">CAC TACTICAL HUB</h1>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="resetPointsOnly()" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded flex items-center gap-1 transition">
          <i class="fa-solid fa-arrow-rotate-left"></i> リセット
        </button>
        <button id="reset-btn" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1.5 rounded flex items-center gap-1 transition">
          <i class="fa-solid fa-rotate-right"></i> 全削除
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-5">

    <!-- Tab Navigation (5 Tabs) -->
    <div class="grid grid-cols-5 gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700 text-[11px] font-bold text-center">
      <button id="tab-score" onclick="switchTab('score')" class="py-2.5 rounded-md bg-amber-500 text-slate-950 shadow transition">
        <i class="fa-solid fa-plus-circle block text-sm mb-0.5"></i>加算
      </button>
      <button id="tab-ranking" onclick="switchTab('ranking')" class="py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-trophy block text-sm mb-0.5"></i>順位
      </button>
      <button id="tab-teams" onclick="switchTab('teams')" class="py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-users-gear block text-sm mb-0.5"></i>チーム
      </button>
      <button id="tab-members" onclick="switchTab('members')" class="py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-user-plus block text-sm mb-0.5"></i>部員
      </button>
      <button id="tab-settings" onclick="switchTab('settings')" class="py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition">
        <i class="fa-solid fa-gear block text-sm mb-0.5"></i>項目設定
      </button>
    </div>

    <!-- TAB 1: SCORE INPUT -->
    <section id="sec-score" class="space-y-4">
      
      <!-- Target Mode Selector -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">1. 対象を選択</h2>
          <div class="flex gap-2 text-xs">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="target-type" value="team" checked onchange="toggleTargetType()" class="accent-amber-500">
              <span class="font-bold text-slate-200">チーム一括</span>
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="target-type" value="individual" onchange="toggleTargetType()" class="accent-amber-500">
              <span class="font-bold text-slate-200">個人（ユーザー）</span>
            </label>
          </div>
        </div>

        <!-- Team Target Select -->
        <div id="target-team-box">
          <select id="team-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-medium focus:outline-none focus:border-amber-500 text-sm">
            <!-- Team Options Injected Here -->
          </select>
        </div>

        <!-- Individual Target Select -->
        <div id="target-indiv-box" class="hidden">
          <select id="player-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-medium focus:outline-none focus:border-amber-500 text-sm">
            <!-- Member Options Injected Here -->
          </select>
        </div>
      </div>

      <!-- Point Buttons -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">2. ポイント項目をタップ</h2>
        
        <!-- Team Point Buttons -->
        <div id="btn-group-team" class="grid grid-cols-1 gap-2.5">
          <!-- Injected via JS -->
        </div>

        <!-- Individual Point Buttons -->
        <div id="btn-group-indiv" class="grid grid-cols-1 gap-2.5 hidden">
          <!-- Injected via JS -->
        </div>
      </div>

      <!-- Recent Log -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase">直近の入力履歴</h3>
        <div id="recent-logs" class="space-y-1.5 text-xs text-slate-300">
          <div class="text-slate-500 italic">履歴はありません</div>
        </div>
      </div>
    </section>

    <!-- TAB 2: RANKING -->
    <section id="sec-ranking" class="hidden space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-300">個人（ユーザー）順位</h2>
        <span id="total-players-count" class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded border border-slate-700">参加者: 0名</span>
      </div>

      <div id="ranking-list" class="space-y-2">
        <!-- Ranking Cards Injected Here -->
      </div>
    </section>

    <!-- TAB 3: TEAM MANAGEMENT -->
    <section id="sec-teams" class="hidden space-y-4">
      <!-- Create Team -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">チーム管理・自動振り分け</h2>
        <div class="space-y-2">
          <input type="text" id="new-team-name" placeholder="チーム名（例: 青チーム）" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
          <div class="flex gap-2 items-center">
            <span class="text-xs text-slate-300 font-bold">カラー:</span>
            <select id="new-team-color" class="flex-1 bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-2 py-2">
              <option value="red">赤 (Red)</option>
              <option value="yellow" selected>黄 (Yellow)</option>
              <option value="emerald">緑 (Emerald)</option>
              <option value="blue">青 (Blue)</option>
              <option value="purple">紫 (Purple)</option>
              <option value="none">無色 (Gray)</option>
            </select>
            <button onclick="addTeam()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">作成</button>
          </div>
        </div>
        <!-- 自動振り分け実行ボタン -->
        <div class="pt-2 border-t border-slate-700/60">
          <button onclick="autoAssignTeams()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-3 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow">
            <i class="fa-solid fa-shuffle"></i> 参加チェックのある部員のみ自動振り分け
          </button>
          <div class="text-[10px] text-slate-400 text-center mt-1">※「部員」タブでチェックが入っている人のみが対象になります</div>
        </div>
      </div>

      <!-- Teams & Assigned Members List -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase">チーム一覧と総レベル・所属部員</h2>
        <div id="teams-container" class="space-y-3">
          <!-- Team Cards Injected Here -->
        </div>
      </div>
    </section>

    <!-- TAB 4: MEMBER MANAGEMENT -->
    <section id="sec-members" class="hidden space-y-4">
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">部員の登録</h2>
        <div class="flex gap-2">
          <input type="text" id="new-member-name" placeholder="名前（例: 才間）" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
          <select id="new-member-level" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-2">
            <option value="1">Lv.1</option>
            <option value="2" selected>Lv.2</option>
            <option value="3">Lv.3</option>
            <option value="4">Lv.4</option>
            <option value="5">Lv.5</option>
            <option value="6">Lv.6</option>
            <option value="7">Lv.7</option>
            <option value="8">Lv.8</option>
            <option value="9">Lv.9</option>
            <option value="10">Lv.10</option>
          </select>
          <button onclick="addSingleMember()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-2 rounded-lg text-sm transition">追加</button>
        </div>
        <div class="pt-2">
          <textarea id="bulk-members" rows="3" placeholder="改行区切りで一括登録（※Lv.1で登録されます）&#10;才間&#10;永塘&#10;眞部&#10;富田" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-500"></textarea>
          <button onclick="addBulkMembers()" class="mt-2 w-full bg-slate-700 hover:bg-slate-650 text-xs font-bold py-2 rounded-lg transition text-slate-200">一括登録する</button>
        </div>
      </div>

      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-400 uppercase">登録部員管理（振分チェック・レベル・チーム変更）</h2>
          <span class="text-[10px] text-amber-400">☑ = 振り分け対象</span>
        </div>
        <div id="members-list" class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
          <!-- Member Items Injected Here -->
        </div>
      </div>
    </section>

    <!-- TAB 5: POINT SETTINGS -->
    <section id="sec-settings" class="hidden space-y-4">
      <!-- Add Point Rule -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">新規ポイント項目の追加</h2>
        <div class="space-y-2">
          <select id="new-rule-target" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
            <option value="team">対象：チーム一括</option>
            <option value="indiv" selected>対象：個人（ユーザー）</option>
          </select>
          <input type="text" id="new-rule-name" placeholder="項目名（例: MVP賞）" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
          <div class="flex gap-2">
            <input type="number" id="new-rule-pts" placeholder="ポイント数（例: 10）" value="5" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
            <button onclick="addPointRule()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">項目を追加</button>
          </div>
        </div>
      </div>

      <!-- Point Rules List -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase">登録済みポイント項目一覧</h2>
        <div id="rules-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
          <!-- Rules Injected Here -->
        </div>
      </div>
    </section>

  </main>

  <!-- 外部JavaScriptファイルの読み込み -->
  <script type="module" src="script.js"></script>
</body>
</html>
